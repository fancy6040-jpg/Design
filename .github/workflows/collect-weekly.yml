name: Collect AI Weekly Content

on:
  schedule:
    # Run daily at 02:00 UTC (10:00 Beijing)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days to look back (default: 30)'
        required: false
        default: '30'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect feeds
        run: node scripts/collect.js
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back || '30' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet data/weekly.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weekly.json data/cache.json
          ITEM_COUNT=$(node -e "const d=require('./data/weekly.json'); console.log(d.total)")
          git commit -m "chore: update weekly feed data (${ITEM_COUNT} items) [skip ci]"
          git push
